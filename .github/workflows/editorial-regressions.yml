name: Editorial regressions

# Intentionally run on every PR: a required check must never disappear because
# a path filter skipped the workflow. The generation job uses the same suites.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editorial-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Editorial regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production editorial dependencies
        run: python -m pip install -r requirements.txt
      - name: Run source, drafting, translation and recovery regressions
        run: |
          python -m unittest discover -s tests -p 'test_insight*.py' -v
          python -m unittest discover -s tests -p 'test_daily_*.py' -v
