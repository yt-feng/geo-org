name: Editorial regressions

# Intentionally run on every PR: a required check must never disappear because
# a path filter skipped the workflow. The generation job uses the same suites.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      inspect_run_id:
        description: "Read only: inspect saved article decision checks from a failed daily run"
        type: string
        default: ""

permissions:
  contents: read
  statuses: write

concurrency:
  group: editorial-regressions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect_run_id != '' }}
    name: Inspect saved editorial metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Inspect only the article schema in the cloud
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSPECT_RUN_ID: ${{ inputs.inspect_run_id }}
        run: |
          set -euo pipefail
          [[ "$INSPECT_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh run view "$INSPECT_RUN_ID" --json workflowName,conclusion,headBranch --jq '.workflowName == "Generate Daily Blog Article" and .headBranch == "main" and (.conclusion == "failure" or .conclusion == "cancelled")' | grep -qx true
          gh run download "$INSPECT_RUN_ID" --name "daily-insight-review-$INSPECT_RUN_ID" --dir "$RUNNER_TEMP/inspect"
          python - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from insight_offline_translation import html_parts, digest
          from hymt_offline_translation import _mask
          for path in sorted((Path(os.environ['RUNNER_TEMP']) / 'inspect' / 'insights').glob('*/zh.json')):
              audit = json.loads(path.read_text(encoding='utf-8'))
              attempts = audit.get('attempts', [])
              if not attempts:
                  continue
              attempt = attempts[-1]
              article = attempt['article']
              body = article.get('body_html', '')
              candidate = {key: article[key] for key in ('title', 'excerpt', 'body_html', 'tags', 'decision_checks') if key in article}
              summary = {
                  'row': audit.get('row'), 'revision': attempt.get('revision'),
                  'error': audit.get('error'), 'body_sha256': hashlib.sha256(body.encode()).hexdigest(),
                  'candidate_bytes': len(json.dumps(candidate, ensure_ascii=False).encode()),
                  'decision_checks': article.get('decision_checks'),
                  'structural': attempt.get('structure'),
                  'revision_response': attempt.get('revision_response'),
                  'review': attempt.get('review'),
                  'historical_fixes': [{'revision': a.get('revision'), 'blockers': a.get('review', {}).get('blockers'), 'issues': a.get('review', {}).get('issues')} for a in attempts if isinstance(a.get('review'), dict)],
              }
              print('EDITORIAL_INSPECTION=' + json.dumps(summary, ensure_ascii=False, separators=(',', ':')))
              parts = html_parts(body)
              for checkpoint_path in sorted((Path(os.environ['RUNNER_TEMP']) / 'inspect' / 'offline-translations').glob('*.json')):
                  checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8'))
                  target = checkpoint.get('target_language')
                  if target not in ('en', 'ar'):
                      continue
                  for key, pending in checkpoint.get('pending_blocks', {}).items():
                      if key.startswith('body_html.'):
                          text = parts[int(key.split('.')[1])][1]
                      elif key in ('title', 'excerpt'):
                          text = article[key]
                      elif key.startswith('tags.'):
                          text = article['tags'][int(key.split('.')[1])]
                      else:
                          continue
                      assert digest(text) == pending['source_sha256'], 'Pending source identity differs'
                      assert len(text) < 6000, 'Diagnostic block exceeds its bound'
                      masked, resources, terms = _mask(text, target)
                      detail = {'target': target, 'block': key, 'completed_blocks': len(checkpoint['blocks']),
                                'source_text': text, 'masked': masked, 'resources': resources, 'terms': terms,
                                'error': pending['error']}
                      print('OFFLINE_PENDING=' + json.dumps(detail, ensure_ascii=False, separators=(',', ':')))
          PY
          if [ "$INSPECT_RUN_ID" = "37152742304" ]; then
            python editorial/apply_saved_revision.py --recipe row710-exact-arithmetic-v1 --source-run "$INSPECT_RUN_ID" --resume-root "$RUNNER_TEMP/inspect" --out "$RUNNER_TEMP/authored-preview.json"
          fi
  verify:
    name: Editorial regression gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # PR events otherwise check out a synthetic merge SHA. Required commit
      # statuses attach to the PR head; test that exact head before reporting it.
      EXPECTED_CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_CHECKOUT_SHA }}
      - name: Mark the actual checked-out commit as awaiting verification
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          test "$sha" = "$EXPECTED_CHECKOUT_SHA"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/$GH_REPO/statuses/$sha" \
            -f state=pending -f context='Editorial verified commit' \
            -f description='Editorial verification is running' \
            -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22.16.0'
      - name: Install production editorial and site dependencies
        id: dependencies
        run: python -m pip install -r requirements.txt -r build-requirements.txt
      - name: Build and verify the actual generated site
        id: verify
        run: |
          python scripts/build_site.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/test-*.mjs
          node --check assets/analytics.js
          node --check observatory/app.js
          node --check _site/package-advisor/app.mjs
      # workflow_dispatch job checks cannot satisfy repository rulesets. A
      # separate commit status reports these actual tests through the supported
      # commit-status API; it never substitutes an unconditional success.
      - name: Report the verified commit result
        if: ${{ always() && steps.identity.outputs.sha != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ steps.identity.outputs.sha }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: python scripts/report_editorial_status.py
