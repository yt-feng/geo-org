name: Test package advisor
on:
  push:
    paths: ['package-advisor/**', 'advisor-service/**', 'tests/test-advisor.mjs', 'tests/test_advisor_visibility.py', 'scripts/i18n_site.py', 'scripts/authority_site.py', '.github/workflows/test-advisor.yml']
  pull_request:
    paths: ['package-advisor/**', 'advisor-service/**', 'tests/test-advisor.mjs', 'tests/test_advisor_visibility.py', 'scripts/i18n_site.py', 'scripts/authority_site.py', '.github/workflows/test-advisor.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test-advisor.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_advisor_visibility.py'
