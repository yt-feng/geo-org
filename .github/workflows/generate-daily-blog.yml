name: Generate Daily Blog Article
# daily-resume-schema: daily-resume-v1

on:
  schedule:
    - cron: "17 18 * * *" # Beijing 02:17; every paid request also checks its actual start/deadline
  workflow_dispatch:
    inputs:
      preview:
        description: "Generate reviewed previews without publishing"
        type: boolean
        default: false
      resume_run_id:
        description: "Optional failed or cancelled run ID whose saved article should be resumed"
        type: string
        default: ""
      editorial_revision_json:
        description: "Optional authored repair of a resumed Chinese draft; all reviews still apply"
        type: string
        default: ""
      saved_editorial_repair:
        description: "Apply an explicit source-bound authored repair in the cloud; all reviews remain required"
        type: choice
        options: [none, row710-exact-arithmetic-v1]
        default: none

permissions:
  contents: write
  actions: write
  checks: read

concurrency:
  group: generate-daily-blog
  cancel-in-progress: false

jobs:
  generate:
    name: Generate one new article
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TZ: Asia/Shanghai
      DEEPSEEK_USAGE_LOG: .artifacts/usage/deepseek.jsonl
      DEEPSEEK_MAX_RUN_REQUESTS: "12"
      DEEPSEEK_MAX_RUN_TOKENS: "600000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A scheduled run queued behind another publisher must select its
          # next article from main at job start, not the older cron-event SHA.
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check actual off-peak admission
        run: python scripts/deepseek_cost_policy.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify insight pipeline
        run: |
          python -m unittest discover -s tests -p "test_insight*.py" -v
          python -m unittest discover -s tests -p "test_daily_*.py" -v

      - name: Restore source-bound offline translation checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .artifacts/offline-translations
          key: geo-offline-fragments-${{ hashFiles('scripts/insight_offline_translation.py', 'scripts/hymt_translation_model_manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            geo-offline-fragments-${{ hashFiles('scripts/insight_offline_translation.py', 'scripts/hymt_translation_model_manifest.json') }}-

      - name: Restore previously verified industry source candidates
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .artifacts/research-catalog-generator.json
          key: geo-research-catalog-generator-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: geo-research-catalog-generator-v1-

      - name: Restore verified sources from the other catalog producer
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .artifacts/research-catalog-preflight.json
          key: geo-research-catalog-preflight-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: geo-research-catalog-preflight-v1-

      - name: Set up pinned offline translation on CPU
        uses: ./.github/actions/setup-offline-translation
        with:
          targets: en,ar

      - name: ${{ inputs.preview == true && 'Generate one researched insight (preview)' || 'Generate one researched insight (production)' }}
        env:
          RESEARCH_CATALOG_PATH: .artifacts/research-catalog-generator.json
          RESEARCH_CATALOG_PEER_PATH: .artifacts/research-catalog-preflight.json
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SITE_URL: https://eco-geo.org
          DEEPSEEK_MODEL: deepseek-flash
          INSIGHT_THINKING: "disabled"
          INSIGHT_REPAIR_THINKING: "enabled"
          INSIGHT_REVIEW_THINKING: "enabled"
          INSIGHT_RESEARCH_MAX_TOKENS: "48000"
          INSIGHT_MAX_TOKENS: "48000"
          INSIGHT_LENGTH_RETRY_MAX_TOKENS: "96000"
          INSIGHT_REVIEW_MAX_TOKENS: "48000"
          DEEPSEEK_REQUEST_DELAY: "0.2"
          DEEPSEEK_RETRIES: "2"
          INSIGHT_MAX_REVISIONS: "2"
          INSIGHT_RESUME_MAX_ATTEMPTS: "3"
          INSIGHT_CROSS_LANGUAGE_RECOVERY_ROUNDS: "0"
          INSIGHT_TRANSLATION_RETRIES: "2"
          INSIGHT_QUALITY_PROFILE: "seo-practical"
          INSIGHT_MIN_ZH_CHARS: "900"
          INSIGHT_API_TIMEOUT: "300"
          PREVIEW_ONLY: ${{ inputs.preview }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
          EDITORIAL_REVISION_JSON: ${{ inputs.editorial_revision_json }}
          SAVED_EDITORIAL_REPAIR: ${{ inputs.saved_editorial_repair }}
          GH_TOKEN: ${{ github.token }}
          NEWS_MAX_ITEMS: "3"
          TAVILY_MAX_QUERIES: "3"
          TAVILY_MAX_RESULTS: "3"
        run: |
          set -euo pipefail
          args=(--save-checkpoint)
          if [ "$PREVIEW_ONLY" = "true" ]; then
            args+=(--preview-dir .artifacts/preview)
          fi
          if [ -n "$RESUME_RUN_ID" ]; then
            [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Resume run ID must contain digits only"; exit 1; }
            gh run view "$RESUME_RUN_ID" --json workflowName,conclusion --jq '.workflowName == "Generate Daily Blog Article" and (.conclusion == "failure" or .conclusion == "cancelled")' | grep -qx true
            gh run download "$RESUME_RUN_ID" --name "daily-insight-review-$RESUME_RUN_ID" --dir "$RUNNER_TEMP/insight-resume"
            if [ -d "$RUNNER_TEMP/insight-resume/offline-translations" ]; then
              mkdir -p .artifacts/offline-translations
              cp -R "$RUNNER_TEMP/insight-resume/offline-translations/." .artifacts/offline-translations/
            fi
            args+=(--resume-dir "$RUNNER_TEMP/insight-resume/insights")
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$PREVIEW_ONLY" != "true" ]; then
            args+=(--auto-resume)
          fi
          if [ -n "$EDITORIAL_REVISION_JSON" ]; then
            [ -z "$SAVED_EDITORIAL_REPAIR" ] || [ "$SAVED_EDITORIAL_REPAIR" = "none" ] || { echo "Choose one authored revision input"; exit 1; }
            [ -n "$RESUME_RUN_ID" ] || { echo "An authored repair requires a resume run"; exit 1; }
            python -c 'import json,os,pathlib; raw=os.environ["EDITORIAL_REVISION_JSON"]; assert len(raw.encode()) <= 60000, "Revision exceeds 60 KB"; assert isinstance(json.loads(raw),dict), "Revision must be JSON object"; pathlib.Path(os.environ["RUNNER_TEMP"],"editorial-revision.json").write_text(raw,encoding="utf-8")'
            args+=(--editorial-revision "$RUNNER_TEMP/editorial-revision.json")
          fi
          if [ -n "$SAVED_EDITORIAL_REPAIR" ] && [ "$SAVED_EDITORIAL_REPAIR" != "none" ]; then
            [ -n "$RESUME_RUN_ID" ] || { echo "A saved authored repair requires its exact source run"; exit 1; }
            python editorial/apply_saved_revision.py --recipe "$SAVED_EDITORIAL_REPAIR" --source-run "$RESUME_RUN_ID" --resume-root "$RUNNER_TEMP/insight-resume" --out "$RUNNER_TEMP/editorial-revision.json"
            args+=(--editorial-revision "$RUNNER_TEMP/editorial-revision.json")
          fi
          python scripts/generate_daily_blog.py --excel assets/blog_articles.xlsx --out blog "${args[@]}"

      - name: Preserve verified research candidates even after generation failure
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .artifacts/research-catalog-generator.json
          key: geo-research-catalog-generator-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve completed offline translation checkpoints
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .artifacts/offline-translations
          key: geo-offline-fragments-${{ hashFiles('scripts/insight_offline_translation.py', 'scripts/hymt_translation_model_manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summarize paid usage by stage
        if: always()
        run: python scripts/deepseek_cost_policy.py --summary

      - name: Save research and review artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: daily-insight-review-${{ github.run_id }}
          path: .artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Seal a small resumable topic checkpoint
        if: always()
        id: checkpoint
        run: python scripts/daily_resume_checkpoint.py --package "$RUNNER_TEMP/daily-checkpoint"

      - name: Preserve attempt-bound continuation checkpoint
        if: ${{ always() && steps.checkpoint.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: daily-insight-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/daily-checkpoint/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Commit generated article
        if: ${{ inputs.preview != true }}
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          RESEARCH_CATALOG_PATH: .artifacts/research-catalog-generator.json
          RESEARCH_CATALOG_PEER_PATH: .artifacts/research-catalog-preflight.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/research_source_catalog.py
          git add blog en ar sitemap.xml index.html robots.txt llms.txt about editorial-policy privacy terms contact resources
          git add scripts/research_source_catalog_seed.json
          if git diff --cached --quiet; then
            echo "No generated blog changes to commit."
          else
            git commit -m "Generate daily blog article"
            python scripts/publish_checked_article.py \
              --branch "automation/daily-article-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the generated article
        if: ${{ steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
