name: Daily research preflight

on:
  schedule:
    - cron: '47 16 * * *' # Verify five upcoming topics before the 18:17 UTC generator.
  pull_request:
    paths:
      - 'scripts/insight_research.py'
      - 'scripts/check_daily_research.py'
      - 'scripts/research_source_catalog.py'
      - 'scripts/research_source_catalog_seed.json'
      - 'requirements.txt'
      - '.github/workflows/daily-research-check.yml'
  workflow_dispatch:
    inputs:
      count:
        description: 'Pending topics to check (1 to 5); no drafting or publication'
        default: '5'
        type: string
      discovery:
        description: 'Search for new leads; false re-fetches saved original sources only'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-research-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    name: Verify upcoming source evidence
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Restore previously verified industry source candidates
        # Actions caches are branch-scoped: PR snapshots cannot replace main's
        # rolling history. Each producer has its own snapshot and reads both.
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .artifacts/research-catalog-preflight.json
          key: geo-research-catalog-preflight-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: geo-research-catalog-preflight-v1-
      - name: Restore verified sources from the other catalog producer
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .artifacts/research-catalog-generator.json
          key: geo-research-catalog-generator-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: geo-research-catalog-generator-v1-

      - name: Read original sources for upcoming topics
        env:
          RESEARCH_CATALOG_PATH: .artifacts/research-catalog-preflight.json
          RESEARCH_CATALOG_PEER_PATH: .artifacts/research-catalog-generator.json
          DISCOVERY_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.discovery }}
          TOPIC_COUNT: ${{ inputs.count || '5' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          NEWS_MAX_ITEMS: '3'
          TAVILY_MAX_QUERIES: '3'
          TAVILY_MAX_RESULTS: '3'
        run: |
          args=()
          if [ "$DISCOVERY_ENABLED" = "false" ]; then args+=(--without-discovery); fi
          python scripts/check_daily_research.py --count "$TOPIC_COUNT" "${args[@]}"
      - name: Preserve successful source reads even if another topic failed
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .artifacts/research-catalog-preflight.json
          key: geo-research-catalog-preflight-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save source provenance and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-research-preflight-${{ github.run_id }}
          path: |
            .artifacts/research-preflight.json
            .artifacts/research-catalog-preflight.json
            .artifacts/research-catalog-generator.json
          include-hidden-files: true
          retention-days: 14
