<!doctype html>
<html lang="zh-CN">

    <style>

      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 20% 0%,rgba(34,150,123,.32),transparent 32rem),linear-gradient(135deg,#050806,var(--bg),#101a13)}
