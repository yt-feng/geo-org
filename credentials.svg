<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">Eco GEO credentials</title>
  <desc id="desc">A high-impact visual credentials wall of selected brands.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#050806"/><stop offset="1" stop-color="#07110d"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/></filter>
    <style>
      .bg{fill:url(#bg)}.tile{filter:url(#glow)}.box{rx:10}.word{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-weight:900;text-anchor:middle;dominant-baseline:middle}.sub{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:middle}.white{fill:#fff}.black{fill:#111}.red{fill:#d82020}.blue{fill:#1477c9}.sky{fill:#00a7df}.gold{fill:#b08a4c}.green{fill:#4f963a}.teal{fill:#14a6a6}.gray{fill:#cfd8dc}.dark{fill:#161616}.muted{fill:#7f8b86}.line{stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.softline{stroke:#dce5e1;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
